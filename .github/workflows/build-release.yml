name: Build and Release

# Builds and tests the Electron app on every v* tag and uploads the
# (unsigned) installer as a workflow artifact. It deliberately does NOT
# create a GitHub release: CI cannot sign (no hardware token) and events
# from the default GITHUB_TOKEN would not trigger npm-publish.yml anyway.
# The release is created manually with `gh release create` (see
# PUBLISHING.md) using a PAT, which fires `release: created` and triggers
# the npm publish.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build Electron app
        run: pnpm build

      - name: Package Windows installer and portable
        run: pnpm exec electron-builder --win --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.yml
          retention-days: 30
