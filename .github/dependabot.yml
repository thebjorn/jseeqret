# Dependabot version updates. The cooldown keeps us off brand-new
# releases for a week so compromised packages get caught upstream
# before a bump PR lands here.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  # Keeps the SHA-pinned actions in .github/workflows up to date
  # (bumps the pin and the version comment together).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
